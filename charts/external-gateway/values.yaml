# -- Base name for generated objects. Defaults to the release name.
fullnameOverride: ""

# -- Labels / annotations added to every object. A per-object value wins on conflict.
commonLabels: {}
commonAnnotations: {}

# -- apiVersion per kind. Override for older or experimental Gateway API installs
# (for example BackendTLSPolicy gateway.networking.k8s.io/v1alpha3, TLSRoute .../v1alpha2).
apiVersions:
  Gateway: gateway.networking.k8s.io/v1
  HTTPRoute: gateway.networking.k8s.io/v1
  GRPCRoute: gateway.networking.k8s.io/v1
  TLSRoute: gateway.networking.k8s.io/v1
  TCPRoute: gateway.networking.k8s.io/v1alpha2
  UDPRoute: gateway.networking.k8s.io/v1alpha2
  BackendTLSPolicy: gateway.networking.k8s.io/v1

# Every object below follows the same convention. A few reserved keys are chart controls
# (named per object). Every other key is copied verbatim into the object's spec, so any field the
# CRD supports works, including fields added in future Gateway API releases. Everything is created
# in the release namespace.

# -- The Gateway. Reserved keys: enabled, name, labels, annotations. Every other key is a Gateway
# spec field: gatewayClassName, listeners (required), addresses, allowedListeners, tls,
# infrastructure (labels, annotations, parametersRef), and anything else the CRD defines.
gateway:
  enabled: true
  # Defaults to the release name.
  name: ""
  labels: {}
  annotations: {}
  # The GatewayClass is installed by the Gateway implementation, not by this chart.
  gatewayClassName: cilium
  # Certificates: annotate the Gateway and cert-manager's Gateway API support issues one per TLS
  # listener, named after the listener's certificateRefs secret.
  # annotations:
  #   cert-manager.io/cluster-issuer: my-issuer
  # Implementation-specific settings, such as pinned load balancer addresses:
  # infrastructure:
  #   annotations:
  #     lbipam.cilium.io/ips: 192.0.2.10,2001:db8::10
  listeners: []
  #  - name: https
  #    hostname: app.example.com
  #    port: 443
  #    protocol: HTTPS
  #    tls:
  #      certificateRefs:
  #        - name: app-example-com-tls

# -- Routes. Each item's reserved keys: kind, apiVersion, name, labels, annotations. kind is one of
# HTTPRoute (the default), GRPCRoute, TLSRoute, TCPRoute, UDPRoute. Spec keys: hostnames,
# parentRefs, rules, and anything else the CRD defines.
# `name` is required. With no routes at all, a single HTTPRoute named after the release sends
# everything to the one service. Per route, parentRefs point at this release's Gateway, and with
# no rules everything (path prefix / for HTTPRoute) goes to the service. A route with no
# hostnames serves the hostnames of the listeners it attaches to, except TLSRoute, which
# requires hostnames. A backendRef that omits name (and port) is filled with the
# service too. All of this applies only when there is exactly one service; with several, spell
# out rules and backendRefs.
routes: []
#  - name: my-route
#    rules:
#      - matches:
#          - path:
#              type: PathPrefix
#              value: /api
#        backendRefs:
#          - weight: 90

# -- Services, backends that are normally outside the cluster.
# Reserved keys: name (required), labels, annotations, ports, endpoints, endpointSlice, backendTLS. Every
# other key is a Service spec field (type, selector, ipFamilyPolicy, ipFamilies, externalName,
# clusterIP, loadBalancerClass, sessionAffinity, ...).
services: []
#  - name: my-backend
#    ports:
#      - port: 443
#        targetPort: 8443
#    endpoints:
#      - hostname: backend1
#        addresses:
#          - 192.0.2.20
#          - 2001:db8::20
# ports: native Service port fields (name, port, targetPort, protocol, appProtocol, nodePort),
# plus endpointPort: the number written into the EndpointSlice port. It defaults to targetPort
# (or port when there is no targetPort) and must be set when targetPort is a name.
# endpoints: each item is a native EndpointSlice endpoint (hostname, nodeName, zone, conditions,
# targetRef, hints) with `addresses` as a mixed list of IPv4 and IPv6 addresses. The chart splits
# them into one IPv4 and one IPv6 EndpointSlice and omits a slice for a family with no addresses.
# conditions defaults to ready: true. Leave endpoints out for selector-based or ExternalName
# Services.
# endpointSlice: nameIPv4, nameIPv6, labels, annotations. Names default to
# <service>-<first port> and <service>-<first port>-v6.
# backendTLS: a BackendTLSPolicy for the Service. Reserved keys: name, labels, annotations. Spec
# keys: validation (hostname, caCertificateRefs, wellKnownCACertificates, subjectAltNames),
# options, targetRefs. targetRefs defaults to the Service. The CA ConfigMap it references is not
# managed by this chart.

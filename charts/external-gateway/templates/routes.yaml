{{- if .Values.gateway.enabled }}
{{- $routes := .Values.routes }}
{{- if not $routes }}{{- $routes = list (dict) }}{{- end }}
{{- $default := dict }}
{{- with .Values.services }}
{{- $first := first . }}
{{- $_ := set $default "name" (include "eg.serviceName" (dict "root" $ "svc" $first "index" 0)) }}
{{- with $first.ports }}{{- $_ := set $default "port" (first .).port }}{{- end }}
{{- end }}
{{- range $i, $r := $routes }}
{{- $kind := default "HTTPRoute" $r.kind }}
{{- $apiVersion := default (get $.Values.apiVersions $kind) $r.apiVersion }}
{{- if not $apiVersion }}{{- fail (printf "unknown route kind %s" $kind) }}{{- end }}
{{- $spec := deepCopy (omit $r "kind" "apiVersion" "name" "labels" "annotations") }}
{{- if and (not $spec.hostnames) $.Values.hostnames (has $kind (list "HTTPRoute" "GRPCRoute" "TLSRoute")) }}
{{- $_ := set $spec "hostnames" $.Values.hostnames }}
{{- end }}
{{- if not $spec.parentRefs }}
{{- $_ := set $spec "parentRefs" (list (dict "name" (include "eg.gatewayName" $))) }}
{{- end }}
{{- if not $spec.rules }}
{{- if not $default.name }}{{- fail "a route without rules needs a service to send traffic to" }}{{- end }}
{{- $rule := dict "backendRefs" (list (deepCopy $default)) }}
{{- if eq $kind "HTTPRoute" }}{{- $_ := set $rule "matches" (list (dict "path" (dict "type" "PathPrefix" "value" "/"))) }}{{- end }}
{{- $_ := set $spec "rules" (list $rule) }}
{{- else }}
{{- $rules := list }}
{{- range $rule := $spec.rules }}
{{- $rule = deepCopy $rule }}
{{- if hasKey $rule "backendRefs" }}
{{- $refs := list }}
{{- range $ref := $rule.backendRefs }}
{{- $ref = deepCopy (default (dict) $ref) }}
{{- if not $ref.name }}
{{- if not $default.name }}{{- fail "a backendRef without name needs a service" }}{{- end }}
{{- $_ := set $ref "name" $default.name }}
{{- if not (hasKey $ref "port") }}{{- if hasKey $default "port" }}{{- $_ := set $ref "port" $default.port }}{{- end }}{{- end }}
{{- end }}
{{- $refs = append $refs $ref }}
{{- end }}
{{- $_ := set $rule "backendRefs" $refs }}
{{- end }}
{{- $rules = append $rules $rule }}
{{- end }}
{{- $_ := set $spec "rules" $rules }}
{{- end }}
{{- $name := $r.name }}
{{- if not $name }}{{- if eq $i 0 }}{{- $name = printf "%s-default-route" (include "eg.fullname" $) }}{{- else }}{{- $name = printf "%s-route-%d" (include "eg.fullname" $) $i }}{{- end }}{{- end }}
---
apiVersion: {{ $apiVersion }}
kind: {{ $kind }}
metadata:
  {{- include "eg.meta" (dict "root" $ "name" $name "labels" $r.labels "annotations" $r.annotations) | nindent 2 }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
{{- end }}

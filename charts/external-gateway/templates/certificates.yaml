{{- $certs := list }}
{{- if .Values.certificate.enabled }}{{- $certs = append $certs .Values.certificate }}{{- end }}
{{- range .Values.extraCertificates }}{{- if include "eg.isEnabled" . }}{{- $certs = append $certs . }}{{- end }}{{- end }}
{{- range $c := $certs }}
{{- $spec := deepCopy (omit $c "enabled" "name" "namespace" "labels" "annotations") }}
{{- if not $spec.issuerRef }}{{- fail "every certificate needs issuerRef" }}{{- end }}
{{- if not $spec.dnsNames }}{{- if $.Values.hostnames }}{{- $_ := set $spec "dnsNames" $.Values.hostnames }}{{- end }}{{- end }}
{{- if not $spec.secretName }}
{{- $first := "" }}
{{- if $spec.dnsNames }}{{- $first = first $spec.dnsNames }}{{- else if $spec.ipAddresses }}{{- $first = first $spec.ipAddresses }}{{- else }}{{- fail "a certificate needs secretName, dnsNames or hostnames" }}{{- end }}
{{- $_ := set $spec "secretName" (printf "%s-tls" $first) }}
{{- end }}
---
apiVersion: {{ $.Values.apiVersions.Certificate }}
kind: Certificate
metadata:
  {{- include "eg.meta" (dict "root" $ "name" (default $spec.secretName $c.name) "namespace" $c.namespace "labels" $c.labels "annotations" $c.annotations) | nindent 2 }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}

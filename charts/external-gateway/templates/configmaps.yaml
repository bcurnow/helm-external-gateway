{{- range $cm := .Values.caConfigMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "eg.meta" (dict "root" $ "name" (required "caConfigMaps[].name is required" $cm.name) "namespace" $cm.namespace "labels" $cm.labels "annotations" $cm.annotations) | nindent 2 }}
{{- with omit $cm "name" "namespace" "labels" "annotations" }}
{{- toYaml . | nindent 0 }}
{{- end }}
{{- end }}

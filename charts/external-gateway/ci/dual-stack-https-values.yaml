# HTTPS gateway in front of a dual-stack backend that re-encrypts with a private CA.
fullnameOverride: app
gateway:
  infrastructure:
    annotations:
      example.com/lb-ips: 192.0.2.10,2001:db8::10
  annotations:
    cert-manager.io/cluster-issuer: example-issuer
  listeners:
  - name: app-example-com-https
    hostname: app.example.com
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - name: app.example.com-tls
services:
- name: app
  ipFamilyPolicy: PreferDualStack
  ports:
  - name: port-80
    port: 80
    targetPort: 9093
    protocol: TCP
  endpoints:
  - hostname: backend1
    addresses:
    - 192.0.2.20
    - 2001:db8::20
  backendTLS:
    validation:
      hostname: backend.example.com
      caCertificateRefs:
      - group: ''
        kind: ConfigMap
        name: example-ca

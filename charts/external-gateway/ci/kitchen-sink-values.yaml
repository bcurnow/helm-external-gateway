# Exercises metadata on every object, multiple listeners, routes, certificates, services,
# ReferenceGrants and ConfigMaps.
fullnameOverride: sink
hostnames:
- a.example.com
- b.example.com
commonLabels:
  team: infra
commonAnnotations:
  owner: infra
gateway:
  name: sink-gw
  labels:
    l: gw
  annotations:
    a: gw
  gatewayClassName: example
  addresses:
  - type: IPAddress
    value: 192.0.2.80
  allowedListeners:
    namespaces:
      from: All
  infrastructure:
    labels:
      l: infra
    annotations:
      a: infra
  defaultListener:
    secretName: shared-tls
    allowedRoutes:
      namespaces:
        from: All
routes:
- name: sink-http
  labels:
    l: route
  annotations:
    a: route
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - weight: 90
    - name: other
      port: 8080
      weight: 10
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
- kind: GRPCRoute
  hostnames:
  - grpc.example.com
  rules:
  - matches:
    - method:
        service: pkg.Svc
    backendRefs:
    - {}
services:
- name: sink-backend
  labels:
    l: svc
  annotations:
    a: svc
  sessionAffinity: ClientIP
  ports:
  - name: https
    port: 443
    targetPort: 8443
    appProtocol: https
  endpoints:
  - hostname: h1
    nodeName: n1
    zone: z1
    addresses:
    - 192.0.2.81
    conditions:
      ready: true
      serving: true
      terminating: false
  endpointSlice:
    nameIPv4: sink-slice
    labels:
      l: slice
    annotations:
      a: slice
  backendTLS:
    name: sink-btls
    labels:
      l: btls
    annotations:
      a: btls
    options:
      example.com/opt: '1'
    validation:
      hostname: backend.example.com
      wellKnownCACertificates: System
      subjectAltNames:
      - type: Hostname
        hostname: backend.example.com
- name: other
  selector:
    app: other
  ports:
  - name: http
    port: 8080

fullnameOverride: pass
hostnames:
- pass.example.com
gateway:
  defaultListener:
    protocol: TLS
    port: 443
    tls:
      mode: Passthrough
routes:
- name: pass-default-route
  kind: TLSRoute
services:
- name: pass
  ports:
  - name: tls
    port: 443
    targetPort: 8443
  endpoints:
  - addresses:
    - 192.0.2.50

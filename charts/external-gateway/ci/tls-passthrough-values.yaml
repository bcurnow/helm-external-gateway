fullnameOverride: pass
gateway:
  listeners:
  - name: pass-example-com-tls
    hostname: pass.example.com
    port: 443
    protocol: TLS
    tls:
      mode: Passthrough
routes:
- name: pass-default-route
  kind: TLSRoute
  hostnames:
  - pass.example.com
services:
- name: pass
  ports:
  - name: tls
    port: 443
    targetPort: 8443
  endpoints:
  - addresses:
    - 192.0.2.50

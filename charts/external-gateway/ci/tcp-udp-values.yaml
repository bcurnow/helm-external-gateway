fullnameOverride: l4
gateway:
  listeners:
  - name: tcp
    port: 5432
    protocol: TCP
  - name: udp
    port: 5353
    protocol: UDP
routes:
- kind: TCPRoute
  parentRefs:
  - name: l4
    sectionName: tcp
- kind: UDPRoute
  name: l4-udp
  parentRefs:
  - name: l4
    sectionName: udp
  rules:
  - backendRefs:
    - name: l4
      port: 5353
services:
- ports:
  - name: tcp
    port: 5432
    protocol: TCP
  - name: udp
    port: 5353
    protocol: UDP
  endpoints:
  - addresses:
    - 192.0.2.60

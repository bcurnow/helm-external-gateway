# IPv4-only Service: the IPv6 address is not given a slice.
fullnameOverride: plain
gateway:
  listeners:
  - name: plain-example-com-http
    hostname: plain.example.com
    port: 80
    protocol: HTTP
services:
- name: plain
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 80
    targetPort: 8080
  endpoints:
  - addresses:
    - 192.0.2.30
    - 2001:db8::30

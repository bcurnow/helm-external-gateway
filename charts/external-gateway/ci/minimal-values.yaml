# The README's minimal example.
gateway:
  listeners:
  - name: app-example-com-https
    hostname: app.example.com
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - name: app.example.com-tls
services:
- name: app
  ports:
  - port: 8080
  endpoints:
  - addresses:
    - 192.0.2.20

fullnameOverride: six
hostnames:
- six.example.com
gateway:
  annotations:
    cert-manager.io/issuer: example-issuer
    cert-manager.io/issuer-kind: Issuer
routes:
- rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: 0s
    backendRefs:
    - {}
services:
- ipFamilies:
  - IPv6
  ipFamilyPolicy: SingleStack
  ports:
  - name: https
    port: 443
    targetPort: 8443
    appProtocol: https
  endpoints:
  - addresses:
    - 2001:db8::40

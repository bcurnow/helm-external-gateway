fullnameOverride: six
gateway:
  annotations:
    cert-manager.io/issuer: example-issuer
    cert-manager.io/issuer-kind: Issuer
  listeners:
  - name: six-example-com-https
    hostname: six.example.com
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - name: six.example.com-tls
routes:
- name: six-default-route
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: 0s
    backendRefs:
    - {}
services:
- name: six
  ipFamilies:
  - IPv6
  ipFamilyPolicy: SingleStack
  ports:
  - name: https
    port: 443
    targetPort: 8443
    appProtocol: https
  endpoints:
  - addresses:
    - 2001:db8::40

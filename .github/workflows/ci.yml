name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Lint and validate every fixture
        run: |
          cd charts/external-gateway
          for f in ci/*-values.yaml; do
            echo "== $f"
            helm lint . -f "$f"
            helm template t . -n test -f "$f" | kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
      - name: Invalid address and family combinations must fail
        run: |
          cd charts/external-gateway
          base=(--set 'gateway.listeners[0].name=h' --set 'gateway.listeners[0].port=80'
                --set 'gateway.listeners[0].protocol=HTTP' --set 'services[0].name=s'
                --set 'services[0].ports[0].port=80')
          expect_fail() {
            if helm template t . "${base[@]}" "$@" >/dev/null 2>&1; then
              echo "expected failure: $*"; exit 1
            fi
          }
          expect_fail --set 'services[0].endpoints[0].addresses={192.0.2}'
          expect_fail --set 'services[0].endpoints[0].addresses={192.0.2.1,2001:db8::1}'
          expect_fail --set 'services[0].endpoints[0].addresses={192.0.2.1,2001:db8::1}' --set services[0].ipFamilyPolicy=SingleStack
          expect_fail --set 'services[0].ipFamilies={IPv4}' --set 'services[0].endpoints[0].addresses={2001:db8::1}'
      - name: Notes report addresses that were left out
        run: |
          cd charts/external-gateway
          helm install t . -n test -f ci/ipv4-only-http-values.yaml --dry-run=client | grep -q "NOT rendered"
